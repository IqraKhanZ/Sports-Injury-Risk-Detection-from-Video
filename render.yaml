services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Service (Docker Environment)
  # -------------------------------------------------------------
  - type: web
    name: sports-injury-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: DB_NAME
        value: sports_injury
      - key: JWT_ALGORITHM
        value: HS256
      - key: CLOUDINARY_CLOUD_NAME
        value: dooj4emku
      - key: CLOUDINARY_API_KEY
        value: 793317176787249
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false

  # -------------------------------------------------------------
  # 2. React Production Frontend (Docker Web Service)
  # -------------------------------------------------------------
  - type: web
    name: sports-injury-frontend
    env: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_URL
        sync: false
